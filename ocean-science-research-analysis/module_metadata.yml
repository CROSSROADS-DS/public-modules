schema_version: 1

slug: ocean-science-research-analysis
title: Ocean Science Research Analysis
short_description: >-
  Analyze ocean science publication data to investigate research activity,
  international collaboration, geographic patterns, and evidence that can
  inform discussion of research priorities.

status: draft
featured: false

audience:
  level: introductory
  estimated_time_minutes: 90
  programming_required: false
  prior_programming_expected: false

activity:
  type: guided-analysis
  scenario_optional: false
  guided: true
  interactive_notebook: activity_interactive_python.ipynb

primary_disciplines:
  - Environmental Science
  - Public Policy

secondary_disciplines:
  - Geography
  - Sustainability Studies
  - Science, Technology, and Society
  - Political Science
  - Economics
  - Business and Management
  - Journalism
  - Science Communication

skills:
  - Exploratory data analysis
  - Data inspection
  - Data visualization
  - Interpretation
  - Evidence-based reasoning
  - Communication

learning_goals:
  - Explain how data analysis can support domain-specific decisions.
  - Inspect a real dataset and identify its structure and limitations.
  - Connect motivating questions with appropriate forms of analysis.
  - Interpret summary statistics, tables, and common visualizations.
  - Describe patterns in research activity and international collaboration.
  - Distinguish supported observations from claims requiring additional evidence.
  - Communicate evidence-based findings and possible recommendations.

motivating_context:
  type: hypothetical
  organization: Natural Sciences and Engineering Research Council of Canada
  organization_abbreviation: NSERC
  description: >-
    Students act as data analysts examining Canada's role in global ocean
    science research. Their findings contribute to a hypothetical discussion
    of future research priorities related to ocean sustainability.
  related_initiatives:
    - United Nations Sustainable Development Goal 14 - Life Below Water
    - United Nations Decade of Ocean Science for Sustainable Development

dataset:
  name: Ocean science publication metadata
  summary: >-
    Publication-level bibliographic metadata describing global ocean science
    research, including publication timing, journals, keywords, ocean basins,
    countries, international collaboration, citation counts, and publication
    identifiers.
  source_type: Dataset derived from bibliographic metadata
  unit_of_analysis: Research publication
  example_fields:
    - Ut
    - Doi
    - pub year
    - Title
    - Journal
    - keywords
    - citation count
    - ocean
    - Country
    - Country unique
    - International
  supports:
    - Publication trends over time
    - Country-level research activity
    - International collaboration patterns
    - Ocean-basin coverage
    - Journal and keyword exploration
  limitations:
    - Some fields may be incomplete.
    - The organization of records must be checked before interpreting counts.
    - >-
      Raw citation counts should not be used for direct research-impact
      comparisons without appropriate field and time normalization.
    - >-
      Publication metadata alone cannot explain observed patterns or determine
      research quality, societal impact, or appropriate funding levels.

files:
  module_guide: module_guide.md
  activity_guide: activity_guide.md
  interactive_python: activity_interactive_python.ipynb
  interactive_r: null
  web_version: activity_web.html
  dataset_files: []
  image_files: []

publication:
  include_in_public_download:
