name: Rebuild CROSSROADS Hub website

on:
  push:
    branches:
      - main
    paths:
      - "public_modules/**"

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger website build
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/catalinVeghes/CU-DSCI-CROSSROADS/actions/workflows/deploy.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${WEBSITE_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{
              \"ref\": \"main\",
              \"inputs\": {
                \"content_sha\": \"${GITHUB_SHA}\"
              }
            }"
