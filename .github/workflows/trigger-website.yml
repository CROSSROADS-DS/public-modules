name: Rebuild CROSSROADS Hub website

on:
  push:
    branches:
      - main
    paths:
      - "public_modules/**"

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger public-hub deployment
    runs-on: ubuntu-latest

    steps:
      - name: Trigger website build
        shell: bash
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          CONTENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$WEBSITE_TOKEN" ]]; then
            echo "::error title=Missing secret::WEBSITE_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          PAYLOAD="$(
            jq -n \
              --arg ref "main" \
              --arg content_sha "$CONTENT_SHA" \
              '{
                ref: $ref,
                inputs: {
                  content_sha: $content_sha
                }
              }'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --url "https://api.github.com/repos/CROSSROADS-DS/public-hub/actions/workflows/deploy.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${WEBSITE_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD"

          echo "Triggered public-hub using content commit ${CONTENT_SHA}."
